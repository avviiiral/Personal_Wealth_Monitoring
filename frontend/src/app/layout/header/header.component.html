<header class="header">
  <div class="header-left">
    <div class="page-context">
      <span class="context-label">Personal Wealth</span>
      <span class="context-title">Financial Overview</span>
    </div>
  </div>

  <div class="header-right">
    <button type="button" class="icon-button" aria-label="Search">
      <svg lucideSearch [size]="19"></svg>
    </button>

    <button type="button" class="icon-button" aria-label="Notifications">
      <svg lucideBell [size]="19"></svg>

      <span class="notification-dot"></span>
    </button>

    <div class="user-profile">
      <div class="avatar">A</div>

      <div class="user-details">
        <span class="user-name">Aviral</span>
        <span class="user-role">Investor</span>
      </div>
    </div>
  </div>
</header>
