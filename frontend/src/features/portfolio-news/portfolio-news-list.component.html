<section class="portfolio-news-page">
  <div class="page-heading">
    <h1>Portfolio News</h1>
    <p>AI-assessed news specifically matched to the holdings you actually own.</p>
  </div>

  <div class="tier-filters">
    <button
      type="button"
      *ngFor="let tier of tiers"
      class="tier-filter-button"
      [class.active]="activeTier === tier.value"
      (click)="selectTier(tier.value)"
    >
      {{ tier.label }}
    </button>
  </div>

  <div class="news-loading" *ngIf="loading">Loading your portfolio news...</div>

  <div class="news-error" *ngIf="error && !loading">{{ error }}</div>

  <div class="news-empty" *ngIf="!loading && !error && items.length === 0">
    No portfolio news yet. As soon as something material happens with your holdings, it will show up
    here.
  </div>

  <div class="news-list" *ngIf="!loading && !error && items.length > 0">
    <button
      type="button"
      class="news-card"
      *ngFor="let item of items"
      [class.unread]="!item.is_read"
      (click)="openItem(item)"
    >
      <span [class]="impactDotClass(item)"></span>

      <div class="news-card-body">
        <div class="news-card-top">
          <strong>{{ item.holding_display_name }}</strong>
          <span class="news-card-category">{{ item.category }}</span>
        </div>

        <span class="news-card-title">{{ item.article_title }}</span>

        <div class="news-card-meta">
          <span>{{ item.article_source }}</span>
          <span class="dot-sep">&middot;</span>
          <span>{{ timeAgo(item.article_published_at) }}</span>
          <span class="dot-sep">&middot;</span>
          <span class="sentiment sentiment--{{ item.sentiment }}">{{ item.sentiment }}</span>
        </div>
      </div>

      <div class="news-card-impact">
        <span class="impact-label">{{ item.impact.replace('_', ' ') }}</span>
      </div>
    </button>
  </div>
</section>
